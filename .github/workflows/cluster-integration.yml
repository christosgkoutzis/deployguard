name: End-to-End Cluster Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools and Local Cluster
        run: ./scripts/setup.sh

      - name: Bootstrap Platform
        run: ./scripts/bootstrap-platform.sh

      - name: Sync Focused Environment
        run: ./scripts/sync-env.sh --focus ruby-gateway

      - name: Verify Focused Environment
        run: |
          source .sync-env.env
          MOCK_APP_NAMES="${MOCKS}" \
          ./scripts/verify.sh

      - name: Sync Full Environment (Deploy all services)
        run: ./scripts/sync-env.sh
      
      - name: Verify Full Environment
        run: |
          source .sync-env.env
          MOCK_APP_NAMES="${MOCKS}" \
          ./scripts/verify.sh

      - name: E2E Functional Validation (via Test Runner)
        run: |
          echo "INFO: Running integrated E2E test suite..."
          ./scripts/run-tests.sh e2e-tests
          
      - name: Debug Cluster State On Failure
        if: ${{ failure() }}
        run: |
          echo "INFO: Debugging ArgoCD applications..."
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd get applications -o yaml || true

          echo "INFO: Debugging deployguard workloads..."
          kubectl -n deployguard get all -o wide || true
          kubectl -n deployguard get ingress,configmap,secret,pvc || true

          echo "INFO: Describing deployguard pods..."
          kubectl -n deployguard get pods -o name \
            | xargs -r -I{} kubectl -n deployguard describe {} || true

          echo "INFO: Recent deployguard logs..."
          kubectl -n deployguard logs --all-containers=true --tail=120 --prefix=true -l app.kubernetes.io/instance=kafka || true
          kubectl -n deployguard logs --all-containers=true --tail=120 --prefix=true -l app.kubernetes.io/name=rabbitmq || true
          kubectl -n deployguard logs --all-containers=true --tail=120 --prefix=true -l app.kubernetes.io/name=minio || true
          kubectl -n deployguard logs --all-containers=true --tail=80 --prefix=true -l app || true

          echo "INFO: Recent deployguard events..."
          kubectl -n deployguard get events --sort-by=.lastTimestamp | tail -n 120 || true
