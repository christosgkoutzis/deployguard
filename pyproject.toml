[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deployguard"
version = "0.2.0"
description = "Local Kubernetes GitOps lab for microservice integration testing and platform experimentation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
    "jsonschema==4.23.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
assessment = ["pytest==8.3.5"]

[project.scripts]
deployguard = "core.cli:main"

[tool.hatch.build]
directory = ".local/build"
dev-mode-dirs = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["scripts/core"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
cache_dir = ".local/cache/pytest"

[tool.deployguard.versions]
kubectl = "v1.33.5"
k3d = "v5.8.3"
k3s = "rancher/k3s:v1.33.5-k3s1"
helm = "v3.18.6"
skaffold = "v2.16.1"
argocd_chart = "8.3.5"
eso_chart = "0.20.1"
nginx = "nginx:1.28.0-alpine"
