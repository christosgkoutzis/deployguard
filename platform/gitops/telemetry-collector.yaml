apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/christosgkoutzis/deployguard.git
    targetRevision: master
    path: platform/charts/telemetry-collector
    helm:
      releaseName: telemetry-collector
  destination:
    server: https://kubernetes.default.svc
    namespace: deployguard
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
