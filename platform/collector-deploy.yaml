apiVersion: apps/v1
kind: Deployment
metadata:
  name: omg-collector-alpha
  labels:
    app: collector
    tenant: alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
      - name: collector
        image: omg-collector:v1
        imagePullPolicy: Never # Use local image for development
        ports:
        - containerPort: 8000
        env:
        - name: TENANT_ID
          value: "Alpha-Tenant"
---
apiVersion: v1
kind: Service
metadata:
  name: omg-collector-service
spec:
  selector:
    app: collector
  ports:
    - protocol: TCP
      port: 80      # Service port for external access
      targetPort: 8000 # Application port (FastAPI)
  type: ClusterIP