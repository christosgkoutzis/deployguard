{{- if ne .Values.workloadType "test" }}
apiVersion: apps/v1
{{- if .Values.persistence.enabled }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ .Release.Name }}-workload
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
{{- if .Values.persistence.enabled }}
  serviceName: {{ .Release.Name }}-service
{{- end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
     containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        {{- if .Values.resources }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
        {{- end }}
        {{- if eq (default "webservice" .Values.workloadType) "webservice" }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        readinessProbe:
          httpGet:
            path: {{ .Values.health.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
        {{- end }}
        {{- if .Values.env }}
        env:
        {{- range $key, $val := .Values.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        {{- end }}
{{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: persistent-storage
          mountPath: {{ .Values.persistence.mountPath | quote }}
  volumeClaimTemplates:
  - metadata:
      name: persistent-storage
      labels:
        app: {{ .Release.Name }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
{{- end }}
{{- end }}
