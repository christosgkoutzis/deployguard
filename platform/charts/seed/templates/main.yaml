apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Values.revision }}
data:
{{- range $key, $val := .Values.files }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-{{ .Values.revision }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.timeout }}
  template:
    metadata:
      labels:
        {{- include "common.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        {{- include "common.container" . | nindent 8 }}
          volumeMounts:
            - name: seeds
              mountPath: /seeds
              readOnly: true
      volumes:
        - name: seeds
          configMap:
            name: {{ .Release.Name }}-{{ .Values.revision }}
