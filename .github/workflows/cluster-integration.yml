name: End-to-End Cluster Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools and Local Cluster
        run: ./scripts/setup.sh
      
      - name: Inject CI Secrets
        run: cp .env.example .env

      - name: Bootstrap Platform
        run: ./scripts/bootstrap-platform.sh

      - name: Sync Focused Environment
        run: |
          FOCUS_SVC=$(yq '.services[0].name' deployguard.yaml)
          echo "INFO: Focusing on $FOCUS_SVC"
          ./scripts/sync-env.sh --focus "$FOCUS_SVC"

      - name: Verify Focused Environment
        run: |
          source .sync-env.env
          MOCK_APP_NAMES="${MOCKS}" \
          ./scripts/verify.sh

      - name: Sync Full Environment (Deploy all services)
        run: ./scripts/sync-env.sh
      
      - name: Verify Full Environment
        run: |
          source .sync-env.env
          MOCK_APP_NAMES="${MOCKS}" \
          ./scripts/verify.sh

      - name: E2E Functional Validation (via Test Runner)
        run: |
          TEST_SVC=$(yq '.services[] | select(.type == "test") | .name' deployguard.yaml | head -n 1)
          if [[ -n "$TEST_SVC" ]]; then
            echo "INFO: Running integrated E2E test suite for $TEST_SVC..."
            ./scripts/run-tests.sh "$TEST_SVC"
          else
            echo "INFO: No test workload defined in deployguard.yaml. Skipping."
          fi
          
      - name: Debug Cluster State On Failure
        if: ${{ failure() }}
        run: |
          echo "INFO: ArgoCD Applications Status..."
          kubectl -n argocd get applications || true

          echo "INFO: Deployguard Workloads Status..."
          kubectl -n deployguard get pods,svc,ingress,pvc || true

          echo "INFO: Fetching details for FAILING or PENDING pods only..."
          kubectl -n deployguard get pods --field-selector=status.phase!=Running,status.phase!=Succeeded -o name \
            | xargs -r -I{} sh -c 'echo "--- Describing {} ---"; kubectl -n deployguard describe {}; echo "--- Logs for {} ---"; kubectl -n deployguard logs {} --all-containers=true --tail=100' || true

          echo "INFO: Recent WARNING events..."
          kubectl -n deployguard get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -n 50 || true
