dependencies:
  # 1. HASHICORP VAULT (Dev Mode)
  - name: vault
    repo: https://helm.releases.hashicorp.com
    chart: vault
    version: "0.27.0"
    set:
      - "server.dev.enabled=true"
      - "server.dev.devRootToken=deployguard-root-token"
      - "ui.enabled=true"
      - "ui.serviceType=ClusterIP"
      - "server.ingress.enabled=true"
      - "server.ingress.ingressClassName=traefik"
      - "server.ingress.hosts[0].host=vault.127.0.0.1.nip.io"
  # 2. MINIO (Official Open-Source S3)
  - name: minio
    repo: https://charts.min.io/
    chart: minio
    version: ""
    set:
      - "mode=standalone"
      - "persistence.enabled=false"
      - "rootUser=admin"
      - "rootPassword=adminpassword"
      - "resources.requests.memory=256Mi"
      - "resources.requests.cpu=100m"
  # 3a. RABBITMQ OPERATOR (Official Cluster Operator)
  - name: rabbitmq-operator
    repo: https://charts.chainguard.dev/
    chart: rabbitmq-cluster-operator
    version: ""
  # 3b. RABBITMQ INSTANCE (Local DeployGuard Custom Resource)
  - name: rabbitmq
    repo: http://host.k3d.internal:8081
    chart: rabbitmq-instance
    version: "0.1.0"
  # 4. POSTGRES (Bitnami - TCP Data Service)
  - name: postgres
    repo: https://charts.bitnami.com/bitnami
    chart: postgresql
    version: "" 
    secret:
      name: my-postgres-secret
      key_values:
        - "postgres-password=secretpassword"
    set:
      - "global.postgresql.auth.existingSecret=my-postgres-secret"
      - "auth.existingSecret=my-postgres-secret"
      - "architecture=standalone"
      - "primary.persistence.size=100Mi"
      - "fullnameOverride=postgres"

  # 5. KAFKA (Local DeployGuard KRaft Chart)
  - name: kafka
    repo: http://host.k3d.internal:8081
    chart: confluent-kafka
    version: "0.1.0"
    set:
      - "image.tag=8.0.6"
      - "heapOpts=-Xms256m -Xmx256m"

  # 6. REDIS (Bitnami - TCP Data Service)
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    chart: redis
    version: ""
    set:
      - "architecture=standalone"
      - "auth.enabled=false"
      - "master.persistence.size=100Mi"
      - "master.resources.limits.memory=128Mi"

  # 7. ELASTICSEARCH (DeployGuard Universal Chart - HTTP Data Service)
  - name: elasticsearch
    repo: http://host.k3d.internal:8081
    chart: universal-chart
    version: "0.1.0"
    set:
      - "persistence.enabled=false"
      - "image.repository=docker.elastic.co/elasticsearch/elasticsearch"
      - "image.tag=8.11.0"
      - "service.port=9200"
      - "service.targetPort=9200"
      - "health.path=/"
      - "ingress.host=elasticsearch.127.0.0.1.nip.io"
      - "env.ES_SETTING_DISCOVERY_TYPE=single-node"
      - "env.ES_SETTING_XPACK_SECURITY_ENABLED=false"
      - "env.ES_SETTING_NODE_STORE_ALLOW__MMAP=false"
      - "env.ES_JAVA_OPTS=-Xms512m -Xmx512m"
mocks:
  - external-api-mock

services:
  - name: python-backend
    depends_on:
      - postgres
      - kafka
      - redis
      - elasticsearch
      - minio
      - rabbitmq-operator
      - rabbitmq
      - vault
    env:
      - INIT_COMMAND="python migrate.py"
      - ES_HOST="http://elasticsearch-service:9200"
      - VAULT_URL="http://vault:8200"
      - S3_ENDPOINT="http://minio:9000"
      - AWS_ACCESS_KEY_ID="admin"
      - AWS_SECRET_ACCESS_KEY="adminpassword"
      - AWS_DEFAULT_REGION="us-east-1"
      - RABBITMQ_HOST="rabbitmq"
    resources:
      limits:
        memory: 256Mi

  - name: ruby-gateway
    depends_on:
      - python-backend
    env:
      - BACKEND_URL="http://python-backend-service:80"

  - name: python-worker
    type: worker
    depends_on:
      - postgres
      - kafka
      - external-api-mock
      - elasticsearch
    env:
      - ES_HOST="http://elasticsearch-service:9200"

  - name: report-worker
    type: worker
    depends_on:
      - postgres
      - minio
      - rabbitmq-operator
      - rabbitmq
      - vault
    env:
      - VAULT_URL="http://vault:8200"
      - S3_ENDPOINT="http://minio:9000"
      - AWS_ACCESS_KEY_ID="admin"
      - AWS_SECRET_ACCESS_KEY="adminpassword"
      - AWS_DEFAULT_REGION="us-east-1"
      - RABBITMQ_HOST="rabbitmq"