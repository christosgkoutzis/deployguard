dependencies:
  # 1. HASHICORP VAULT (Dev Mode)
  - name: vault
    repo: https://helm.releases.hashicorp.com
    chart: vault
    version: "0.27.0"
    set:
      - "injector.enabled=false"
      - "server.dev.enabled=true"
      - "server.dev.devRootToken=deployguard-root-token"
      - "ui.enabled=true"
      - "ui.serviceType=ClusterIP"
      - "server.ingress.enabled=true"
      - "server.ingress.ingressClassName=traefik"
      - "server.ingress.hosts[0].host=vault.127.0.0.1.nip.io"
  # 2. MINIO (Official Open-Source S3)
  - name: minio
    repo: https://charts.min.io/
    chart: minio
    version: ""
    set:
      - "mode=standalone"
      - "persistence.enabled=false"
      - "rootUser=admin"
      - "rootPassword=adminpassword"
      - "resources.requests.memory=256Mi"
      - "resources.requests.cpu=100m"
  # 3. RABBITMQ (Native Local Chart)
  - name: rabbitmq
    repo: http://host.k3d.internal:8081
    chart: rabbitmq-instance
    version: "0.1.0"
  # 4. POSTGRES (Bitnami - TCP Data Service)
  - name: postgres
    repo: https://charts.bitnami.com/bitnami
    chart: postgresql
    version: "" 
    secret:
      name: my-postgres-secret
      key_values:
        - "postgres-password=secretpassword"
    set:
      - "global.postgresql.auth.existingSecret=my-postgres-secret"
      - "auth.existingSecret=my-postgres-secret"
      - "architecture=standalone"
      - "primary.persistence.size=100Mi"
      - "fullnameOverride=postgres"

  # 5. KAFKA (Local DeployGuard KRaft Chart)
  - name: kafka
    repo: http://host.k3d.internal:8081
    chart: confluent-kafka
    version: "0.1.0"
    set:
      - "image.tag=8.0.6"
      - "heapOpts=-Xms256m -Xmx256m"

  # 6. REDIS (Bitnami - TCP Data Service)
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    chart: redis
    version: ""
    set:
      - "architecture=standalone"
      - "auth.enabled=false"
      - "master.persistence.size=100Mi"
      - "master.resources.limits.memory=128Mi"

  # 7. ELASTICSEARCH (DeployGuard Universal Chart - HTTP Data Service)
  - name: elasticsearch
    repo: http://host.k3d.internal:8081
    chart: universal-chart
    version: "0.1.0"
    set:
      - "persistence.enabled=false"
      - "image.repository=docker.elastic.co/elasticsearch/elasticsearch"
      - "image.tag=8.11.0"
      - "service.port=9200"
      - "service.targetPort=9200"
      - "health.path=/"
      - "ingress.host=elasticsearch.127.0.0.1.nip.io"
      - "env.ES_SETTING_DISCOVERY_TYPE=single-node"
      - "env.ES_SETTING_XPACK_SECURITY_ENABLED=false"
      - "env.ES_SETTING_NODE_STORE_ALLOW__MMAP=false"
      - "env.ES_JAVA_OPTS=-Xms512m -Xmx512m"

# 8. KAFBAT UI (Active Community Fork of Provectus Kafka UI)
  - name: kafbat-ui
    repo: https://kafbat.github.io/helm-charts
    chart: kafka-ui
    version: "*"
    set:
      - "envs.config.KAFKA_CLUSTERS_0_NAME=local-kraft"
      - "envs.config.KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092"
      - "envs.config.AUTH_TYPE=DISABLED"
      - "resources.requests.cpu=50m"
      - "resources.requests.memory=128Mi"
      - "resources.limits.memory=256Mi"
      - "ingress.enabled=true"
      - "ingress.ingressClassName=traefik"
      - "ingress.host=kafka-ui.127.0.0.1.nip.io"

  # 9. DOZZLE (Lightweight K8s Log Viewer - Community Chart)
  - name: dozzle
    repo: https://abnerrizzi.github.io/charts/
    chart: dozzle
    version: "*"
    set:
      - "rbac.create=true"
      - "serviceAccount.create=true"
      - "env.DOZZLE_MODE=k8s"
      - "env.DOZZLE_FILTER=status=running"
      - "resources.requests.cpu=50m"
      - "resources.requests.memory=64Mi"
      - "resources.limits.memory=128Mi"
      - "ingress.enabled=true"
      - "ingress.className=traefik"
      - "ingress.hosts[0].host=dozzle.127.0.0.1.nip.io"
      - "ingress.hosts[0].paths[0].path=/"
      - "ingress.hosts[0].paths[0].pathType=Prefix"
      
mocks:
  - external-api-mock

services:
  - name: python-backend
    depends_on:
      - postgres
      - kafka
      - redis
      - elasticsearch
      - minio
      - rabbitmq
      - vault
    env:
      # 1. Platform Seed (Vault) -> 2. App Migration (Tables) -> 3. App Seed (Dummy Data)
      - INIT_COMMAND="python /platform-seeds/seed_vault.py && python migrate.py && python seed_db.py"
      - ES_HOST="http://elasticsearch-service:9200"
      - VAULT_URL="http://vault:8200"
      - S3_ENDPOINT="http://minio:9000"
      - AWS_ACCESS_KEY_ID="admin"
      - AWS_SECRET_ACCESS_KEY="adminpassword"
      - AWS_DEFAULT_REGION="us-east-1"
      - RABBITMQ_HOST="rabbitmq"
    resources:
      limits:
        memory: 256Mi

  - name: ruby-gateway
    depends_on:
      - python-backend
    env:
      - BACKEND_URL="http://python-backend-service:80"

  - name: python-worker
    type: worker
    depends_on:
      - postgres
      - kafka
      - external-api-mock
      - elasticsearch
      - vault
    env:
      - ES_HOST="http://elasticsearch-service:9200"
      - VAULT_URL="http://vault:8200"

  - name: report-worker
    type: worker
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - vault
    env:
      - VAULT_URL="http://vault:8200"
      - S3_ENDPOINT="http://minio:9000"
      - AWS_ACCESS_KEY_ID="admin"
      - AWS_SECRET_ACCESS_KEY="adminpassword"
      - AWS_DEFAULT_REGION="us-east-1"
      - RABBITMQ_HOST="rabbitmq"
      
  - name: e2e-tests
    type: test
    depends_on:
      - ruby-gateway
      - python-backend
    env:
      - TARGET_URL="http://ruby-gateway-service:80"