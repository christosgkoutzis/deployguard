name: End-to-End Cluster Validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tools and Local Cluster
        run: ./scripts/setup.sh

      - name: Bootstrap Platform
        run: ./scripts/bootstrap-platform.sh

      - name: Sync Declarative Environment
        run: ./scripts/sync-env.sh

      - name: Verify Environment Health
        run: |
          source .sync-env.env
          PLATFORM_APPS="${PLATFORM_APPS_COMBINED}" \
          MOCK_APP_NAMES="${MOCKS}" \
          VERIFY_PROM_EXPECTED_JOBS="${SERVICES},prometheus" \
          ./scripts/verify.sh
