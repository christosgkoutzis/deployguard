server:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.127.0.0.1.nip.io
configs:
  params:
    server.insecure: true
  cm:
    resource.customizations.health.argoproj.io_Application: |
      local hs = {status = "Progressing", message = "Waiting for child Application"}
      if obj.status and obj.status.health and obj.status.sync and obj.spec.source then
        if obj.status.sync.status ~= "Synced" or obj.status.sync.revision ~= obj.spec.source.targetRevision then
          return hs
        end
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
        if obj.metadata.labels and obj.metadata.labels["deployguard.io/type"] == "test" then
          hs.status = "Healthy"
        end
      end
      return hs
    resource.customizations.health.external-secrets.io_ExternalSecret: |
      local hs = {status = "Progressing", message = "Waiting for Secret synchronization"}
      if obj.status and obj.status.conditions then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            local after = obj.metadata.annotations and obj.metadata.annotations["deployguard.io/refresh-after"]
            if after and (not obj.status.refreshTime or obj.status.refreshTime < after) then
              return hs
            end
            hs.status = "Healthy"
            hs.message = "Secret synchronized"
          end
        end
      end
      return hs
    resource.customizations.health.external-secrets.io_SecretStore: |
      local hs = {status = "Progressing", message = "Waiting for secret provider"}
      if obj.status and obj.status.conditions then
        for _, condition in ipairs(obj.status.conditions) do
          if condition.type == "Ready" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = "Secret provider ready"
          end
        end
      end
      return hs
