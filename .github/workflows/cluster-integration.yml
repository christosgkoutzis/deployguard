name: End-to-End Integration

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  cluster-validation:
    name: Cluster Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bash Syntax Check
        run: |
          echo "INFO: Checking bash syntax for all scripts..."
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Bootstrap Cluster & ArgoCD
        run: |
          ./scripts/setup.sh
          ./scripts/bootstrap-platform.sh

      - name: Scaffold Services
        run: |
          for dir in app/*/; do
            ./scripts/add-service.sh "$(basename "${dir}")"
          done

      - name: Build and Deploy (Local GitOps)
        run: |
          services=()
          for dir in app/*/; do
            services+=("$(basename "${dir}")")
          done
          app_names="$(IFS=','; echo "${services[*]}")"
          ARGO_APP_NAMES="${app_names},prometheus" ./scripts/dev-deploy.sh

      - name: Verify Ecosystem Health
        run: ./scripts/verify.sh