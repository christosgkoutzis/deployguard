apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 26.0.0
    helm:
      releaseName: prometheus
      values: |
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        pushgateway:
          enabled: false
        server:
          persistentVolume:
            enabled: false
        serverFiles:
          prometheus.yml:
            global:
              scrape_interval: 15s
            scrape_configs:
              - job_name: prometheus
                static_configs:
                  - targets:
                      - localhost:9090
              - job_name: telemetry-collector
                metrics_path: /metrics
                static_configs:
                  - targets:
                      - telemetry-collector-service.deployguard.svc.cluster.local:80
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true