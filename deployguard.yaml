apiVersion: deployguard/v1
name: deployguard

dependencies:
  # Vault: local development secrets.
  - name: vault
    repo: https://helm.releases.hashicorp.com
    chart: vault
    version: "0.27.0"
    set:
      - "injector.enabled=false"
      - "server.dev.enabled=true"
      - "server.dev.devRootToken=unused-local-env-placeholder"
      - "ui.enabled=true"
      - "ui.serviceType=ClusterIP"
      - "server.ingress.enabled=true"
      - "server.ingress.ingressClassName=traefik"
      - "server.ingress.hosts[0].host=vault.${CLUSTER_DOMAIN}"
    values:
      server:
        extraArgs: '-dev-root-token-id="$(cat /vault/userconfig/bootstrap/token)"'
        volumes:
          - name: bootstrap
            secret:
              secretName: vault-bootstrap
        volumeMounts:
          - name: bootstrap
            mountPath: /vault/userconfig/bootstrap
            readOnly: true
  # SeaweedFS: local S3-compatible storage.
  - name: seaweedfs
    repo: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    version: "4.48.0"
    values:
      image:
        tag: "4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"
      global:
        seaweedfs:
          createClusterRole: false
          automountServiceAccountToken: false
      master:
        enabled: false
      volume:
        enabled: false
      filer:
        enabled: false
      allInOne:
        enabled: true
        s3:
          enabled: true
        data:
          type: emptyDir
        secretExtraEnvironmentVars:
          AWS_ACCESS_KEY_ID:
            secretKeyRef: {name: platform-bootstrap-secrets, key: S3_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY:
            secretKeyRef: {name: platform-bootstrap-secrets, key: S3_SECRET_ACCESS_KEY}
        resources:
          requests: {memory: 256Mi, cpu: 100m}
          limits: {memory: 1Gi, cpu: "1"}
  # RabbitMQ: report task queue.
  - name: rabbitmq
    path: platform/dependencies/rabbitmq-instance-chart
    set:
      - "auth.existingSecret=platform-bootstrap-secrets"
      - "auth.passwordKey=RABBITMQ_PASSWORD"
  # PostgreSQL: application data.
  - name: postgres
    repo: https://charts.bitnami.com/bitnami
    chart: postgresql
    version: "18.8.13"
    set:
      - "auth.existingSecret=platform-bootstrap-secrets"
      - "auth.secretKeys.adminPasswordKey=POSTGRES_PASSWORD"
      - "architecture=standalone"
      - "primary.persistence.size=100Mi"
      - "fullnameOverride=postgres"

  # Kafka: greeting events.
  - name: kafka
    path: platform/dependencies/confluent-kafka-chart
    set:
      - "image.tag=8.0.6"
      - "heapOpts=-Xms256m -Xmx256m"

  # Redis: greeting cache.
  - name: redis
    repo: https://charts.bitnami.com/bitnami
    chart: redis
    version: "28.0.10"
    set:
      - "architecture=standalone"
      - "auth.enabled=true"
      - "auth.existingSecret=platform-bootstrap-secrets"
      - "auth.existingSecretPasswordKey=REDIS_PASSWORD"
      - "master.persistence.size=100Mi"
      - "master.resources.limits.memory=128Mi"

  # Elasticsearch: greeting search.
  - name: elasticsearch
    path: platform/charts/webservice
    set:
      - "persistence.enabled=false"
      - "externalSecret.enabled=false"
      - "image.repository=docker.elastic.co/elasticsearch/elasticsearch"
      - "image.tag=8.11.0"
      - "service.port=9200"
      - "service.targetPort=9200"
      - "health.path=tcp"
      - "ingress.host=elasticsearch.${CLUSTER_DOMAIN}"
      - "env.ES_SETTING_DISCOVERY_TYPE=single-node"
      - "env.ES_SETTING_XPACK_SECURITY_ENABLED=true"
      - "env.ES_SETTING_XPACK_SECURITY_HTTP_SSL_ENABLED=false"
      - "secretEnv.ELASTIC_PASSWORD.name=platform-bootstrap-secrets"
      - "secretEnv.ELASTIC_PASSWORD.key=ELASTIC_PASSWORD"
      - "env.ES_SETTING_NODE_STORE_ALLOW__MMAP=false"
      - "env.ES_JAVA_OPTS=-Xms512m -Xmx512m"

  # Kafbat UI: Kafka inspection.
  - name: kafbat-ui
    depends_on: [kafka]
    repo: https://kafbat.github.io/helm-charts
    chart: kafka-ui
    version: "1.6.5"
    set:
      - "envs.config.KAFKA_CLUSTERS_0_NAME=local-kraft"
      - "envs.config.KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092"
      - "envs.config.AUTH_TYPE=DISABLED"
      - "resources.requests.cpu=50m"
      - "resources.requests.memory=128Mi"
      - "resources.limits.memory=256Mi"
      - "ingress.enabled=true"
      - "ingress.ingressClassName=traefik"
      - "ingress.host=kafka-ui.${CLUSTER_DOMAIN}"

  # Dozzle: pod log viewer.
  - name: dozzle
    repo: https://abnerrizzi.github.io/charts/
    chart: dozzle
    version: "0.1.3"
    set:
      - "rbac.create=true"
      - "serviceAccount.create=true"
      - "env.DOZZLE_MODE=k8s"
      - "env.DOZZLE_FILTER=status=running"
      - "resources.requests.cpu=50m"
      - "resources.requests.memory=64Mi"
      - "resources.limits.memory=128Mi"
      - "ingress.enabled=true"
      - "ingress.className=traefik"
      - "ingress.hosts[0].host=dozzle.${CLUSTER_DOMAIN}"
      - "ingress.hosts[0].paths[0].path=/"
      - "ingress.hosts[0].paths[0].pathType=Prefix"

mocks:
  - external-api-mock

services:
  - name: python-backend
    depends_on:
      - external-api-mock
      - postgres
      - kafka
      - redis
      - elasticsearch
      - seaweedfs
      - rabbitmq
      - vault-backend
    external_secret:
      store: vault-backend
      path: deployguard/python-backend
    env:
      # Backend initialization creates tables and sample data after Vault is seeded.
      - INIT_COMMAND=python migrate.py && python seed_db.py
      - ES_HOST=http://elasticsearch-service:9200
      - VAULT_URL=http://vault:8200
      - S3_ENDPOINT=http://seaweedfs-all-in-one:8333
      - AWS_DEFAULT_REGION=us-east-1
      - RABBITMQ_HOST=rabbitmq
    resources:
      limits:
        memory: 256Mi

    secret_env:
      AWS_ACCESS_KEY_ID: {name: platform-bootstrap-secrets, key: S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: {name: platform-bootstrap-secrets, key: S3_SECRET_ACCESS_KEY}
      RABBITMQ_PASSWORD: {name: platform-bootstrap-secrets, key: RABBITMQ_PASSWORD}
      POSTGRES_PASSWORD: {name: platform-bootstrap-secrets, key: POSTGRES_PASSWORD}
      VAULT_ROOT_TOKEN: {name: platform-bootstrap-secrets, key: VAULT_ROOT_TOKEN}
      REDIS_PASSWORD: {name: platform-bootstrap-secrets, key: REDIS_PASSWORD}
      ELASTIC_PASSWORD: {name: platform-bootstrap-secrets, key: ELASTIC_PASSWORD}
  - name: ruby-gateway
    depends_on:
      - python-backend
    env:
      - BACKEND_URL=http://python-backend-service:80

  - name: python-worker
    type: worker
    depends_on:
      - python-backend
      - postgres
      - kafka
      - external-api-mock
      - elasticsearch
      - vault-backend
    external_secret:
      store: vault-backend
      path: deployguard/python-worker
    env:
      - ES_HOST=http://elasticsearch-service:9200
      - VAULT_URL=http://vault:8200

    secret_env:
      VAULT_ROOT_TOKEN: {name: platform-bootstrap-secrets, key: VAULT_ROOT_TOKEN}
      ELASTIC_PASSWORD: {name: platform-bootstrap-secrets, key: ELASTIC_PASSWORD}
  - name: report-worker
    type: worker
    depends_on:
      - python-backend
      - postgres
      - seaweedfs
      - rabbitmq
      - vault-backend
    external_secret:
      store: vault-backend
      path: deployguard/report-worker
    env:
      - VAULT_URL=http://vault:8200
      - S3_ENDPOINT=http://seaweedfs-all-in-one:8333
      - AWS_DEFAULT_REGION=us-east-1
      - RABBITMQ_HOST=rabbitmq

    secret_env:
      AWS_ACCESS_KEY_ID: {name: platform-bootstrap-secrets, key: S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: {name: platform-bootstrap-secrets, key: S3_SECRET_ACCESS_KEY}
      RABBITMQ_PASSWORD: {name: platform-bootstrap-secrets, key: RABBITMQ_PASSWORD}
      VAULT_ROOT_TOKEN: {name: platform-bootstrap-secrets, key: VAULT_ROOT_TOKEN}
  - name: e2e-tests
    type: test
    depends_on:
      - ruby-gateway
      - python-backend
      - python-worker
      - report-worker
      - external-api-mock
    env:
      - TARGET_URL=http://ruby-gateway-service:80
      - S3_ENDPOINT=http://seaweedfs-all-in-one:8333

# Explicit local bootstrap Secrets. Values name environment variables, never credentials.
secrets:
  - name: platform-bootstrap-secrets
    values:
      VAULT_ROOT_TOKEN: VAULT_ROOT_TOKEN
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      S3_SECRET_ACCESS_KEY: S3_SECRET_ACCESS_KEY
      S3_ACCESS_KEY_ID: S3_ACCESS_KEY_ID
      RABBITMQ_PASSWORD: RABBITMQ_PASSWORD
      REDIS_PASSWORD: REDIS_PASSWORD
      ELASTIC_PASSWORD: ELASTIC_PASSWORD
  - name: vault-bootstrap
    values:
      token: VAULT_ROOT_TOKEN

seeds:
  - name: vault-seeder
    build_path: seeds/vault-seeder
    files: seeds/vault-seeder
    command: [python, /seeds/seed_vault.py]
    depends_on: [vault]
    env_from: [platform-bootstrap-secrets]

secret_stores:
  - name: vault-backend
    server: http://vault.${NAMESPACE}.svc.cluster.local:8200
    path: secret
    token_secret: {name: vault-bootstrap, key: token}
    depends_on: [vault-seeder]
